name: Update digest

on:
  schedule:
    - cron: '0 5 * * 1,4'  # 10:00 Ekaterinburg (UTC+5), Mon & Thu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch news
        run: npm run fetch-news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build (smoke check)
        run: npm run build

      - name: Commit and push if news.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json
          if git diff --cached --quiet; then
            echo "No changes to news.json — skipping commit"
          else
            git commit -m "digest: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
